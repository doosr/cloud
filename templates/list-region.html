<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Régions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
        }

        .page-header {
            background: linear-gradient(135deg, #1a365d, #2d3748);
            padding: 2rem;
            text-align: center;
            color: white;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .regions-table {
            width: 100%;
            background: white;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .regions-table th {
            background: #2d3748;
            color: white;
            text-align: center;
            padding: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .regions-table td {
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .regions-table tr:last-child td {
            border-bottom: none;
        }

        .regions-table tr:nth-child(even) {
            background: #f8fafc;
        }

        .regions-table tr:hover {
            background: #edf2f7;
            transition: background-color 0.3s;
        }

        .page-actions {
            display: flex;
            justify-content: center;
        }

        .back-link {
            padding: 0.75rem 1.5rem;
            background: #2d3748;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .back-link:hover {
            background: #1a365d;
            transform: translateY(-2px);
        }

        .back-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: all 0.6s;
        }

        .back-link:hover::before {
            left: 100%;
        }

        .click-effect {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.5);
            transform: scale(0);
            animation: click-animate 0.5s linear;
        }

        @keyframes click-animate {
            to {
                transform: scale(3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>Liste des Régions</h1>
    </div>

    <div class="container">
        <table class="regions-table">
            <thead>
                <tr>
                    <th>ID Région</th>
                    <th>Nom de la Région</th>
                </tr>
            </thead>
            <tbody>
                {% for region in regions %}
                <tr>
                    <td>{{ region[0] }}</td>
                    <td>{{ region[1] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="page-actions">
            <a href="{{ url_for('home') }}" class="back-link" id="homeButton">Retour à l'accueil</a>
        </div>
    </div>

    <script>
        document.getElementById('homeButton').addEventListener('click', function(e) {
            const circle = document.createElement('span');
            circle.classList.add('click-effect');
            circle.style.left = `${e.offsetX}px`;
            circle.style.top = `${e.offsetY}px`;
            this.appendChild(circle);
            setTimeout(() => circle.remove(), 500);
        });
    </script>
</body>
</html>
