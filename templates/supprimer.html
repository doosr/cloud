<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de suppression</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #34495e;
            --accent-color: #4285f4;
            --delete-color: #d93025;
            --background-color: #f8f9fa;
            --text-color: #202124;
            --border-radius: 12px;
            --box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
            padding: 1rem;
        }

        .delete-container {
            width: 100%;
            max-width: 480px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 2.5rem;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .delete-container:hover {
            transform: translateY(-5px);
        }

        .warning-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background-color: rgba(217, 48, 37, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .warning-icon svg {
            width: 50px;
            height: 50px;
            fill: var(--delete-color);
        }

        .page-header h1 {
            color: var(--delete-color);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .confirmation-message {
            color: var(--secondary-color);
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-delete {
            background-color: var(--delete-color);
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(217, 48, 37, 0.3);
        }

        .btn-delete:hover {
            background-color: #b52b1e;
            box-shadow: 0 6px 16px rgba(217, 48, 37, 0.4);
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-cancel:hover {
            background-color: rgba(66, 133, 244, 0.05);
        }

        @media (max-width: 600px) {
            .delete-container {
                width: 95%;
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="delete-container">
        <div class="warning-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2L1 22h22L12 2zm0 16.25a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5zm1-4.25h-2v-6h2v6z"/>
            </svg>
        </div>
        
        <div class="page-header">
            <h1>Confirmation de suppression</h1>
        </div>

        <p class="confirmation-message">
            Êtes-vous absolument certain de vouloir supprimer ce client ? 
            Cette action est irréversible et supprimera définitivement toutes les informations associées.
        </p>

        <form method="POST" action="/supprimer/{{ client_id }}">
            <button type="submit" class="btn btn-delete">
                Supprimer définitivement
            </button>
        </form>

        <a href="/liste_client" class="btn btn-cancel">
            Annuler et revenir
        </a>
    </div>
</body>
</html>
