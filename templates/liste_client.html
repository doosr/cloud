<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Clients</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #eaeaec;
            color: #1a1a1a;
        }

        .page-header {
            background: linear-gradient(135deg, #1a365d, #2d3748);
            padding: 2rem;
            text-align: center;
            color: white;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .search-section {
            margin-bottom: 2rem;
        }

        .search-form {
            display: flex;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem 0 0 0.5rem;
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #4299e1;
        }

        .search-button {
            padding: 0.75rem 1.5rem;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 0 0.5rem 0.5rem 0;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .search-button:hover {
            background: #3182ce;
        }

        .client-table {
            width: 100%;
            background: white;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .client-table th {
            background: #2d3748;
            color: white;
            text-align: left;
            padding: 1rem;
            font-weight: 600;
        }

        .client-table td {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .client-table tr:last-child td {
            border-bottom: none;
        }

        .client-table tr:nth-child(even) {
            background: #f8fafc;
        }

        .client-table tr:hover {
            background: #edf2f7;
        }

        .action-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .action-link {
            color: #4299e1;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .action-link:hover {
            color: #3182ce;
            text-decoration: underline;
        }

        .page-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .page-action-link {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s, background 0.3s;
        }

        .page-action-link:hover {
            transform: translateY(-2px);
        }

        .add-link {
            background: #4299e1;
            color: white;
        }

        .add-link:hover {
            background: #3182ce;
        }

        .back-link {
            background: #2d3748;
            color: white;
        }

        .back-link:hover {
            background: #1a365d;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>Gestion des Clients</h1>
    </div>

    <div class="container">
        <div class="search-section">
            <form class="search-form" method="GET" action="{{ url_for('list_clients') }}">
                <input type="text" name="search" class="search-input" value="{{ search_query }}" placeholder="Rechercher un client">
                <button type="submit" class="search-button">Rechercher</button>
            </form>
        </div>

        <table class="client-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Âge</th>
                    <th>Région</th>
                    <th style="text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for client in clients %}
                <tr>
                    <td>{{ client[0] }}</td>
                    <td>{{ client[1] }}</td>
                    <td>{{ client[2] }}</td>
                    <td>{{ client[3] }}</td>
                    <td>{{ client[4] }}</td>
                    <td class="action-links">
                        <a href="/modifier/{{ client[0] }}" class="action-link">Modifier</a>
                        <a href="/supprimer/{{ client[0] }}" class="action-link">Supprimer</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="page-actions">
            <a href="/ajout_client" class="page-action-link add-link">Ajouter un client</a>
            <a href="{{ url_for('home') }}" class="page-action-link back-link">Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
